[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-writer-langgraph"
version = "0.1.0"
description = "基于 LangGraph 的专利写作智能体：技术交底书 -> 完整专利文档"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "markdown>=3.5.0",
    "python-docx>=0.8.11",
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "typing-extensions>=4.8.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
figures = ["matplotlib>=3.7.0"]
ui = ["gradio>=4.0.0"]

[project.scripts]
patent-writer = "main:main"

[tool.setuptools]
py-modules = ["config", "main", "sequential", "service", "logging_config"]

[tool.setuptools.packages.find]
include = ["agents*", "utils*", "workflow*"]
